<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reversi">
  <!-- Colours are inlined: a favicon is loaded outside the page, so no CSS variable reaches it. -->
  <rect x="4" y="10" width="56" height="46" rx="8" fill="#1e7a4f" stroke="#0b3a24" stroke-width="3" />

  <g stroke="#0b3a24" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M 4 25 H 60" />
    <path d="M 4 41 H 60" />
    <path d="M 22 10 V 56" />
    <path d="M 42 10 V 56" />
  </g>

  <!-- Corner disc, crowned: the square that can never be taken back. -->
  <circle cx="13" cy="18" r="6.5" fill="#141414" />
  <path d="M 7 15 L 7 9.5 L 10 12 L 13 8 L 16 12 L 19 9.5 L 19 15 Z" fill="#f2c94c" />

  <!-- Disc caught on its rim, half black and half white. -->
  <ellipse cx="51" cy="48" rx="6.5" ry="6.5" fill="#f1f5f2" />
  <path d="M 51 41.5 A 6.5 6.5 0 0 0 51 54.5 Z" fill="#141414" />

  <circle cx="32" cy="33" r="8" fill="#f1f5f2" />
  <circle cx="32" cy="33" r="8" fill="#141414" clip-path="url(#logo-half)" />

  <defs>
    <clipPath id="logo-half">
      <rect x="24" y="25" width="8" height="16" />
    </clipPath>
  </defs>
</svg>
