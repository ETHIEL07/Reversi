# Reversi API on Fly.io (free tier)
app = "reversi-api"
primary_region = "ams"  # Amsterdam, closest to EU

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "micro"
  cpus = 1
